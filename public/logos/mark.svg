<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Top piece: wide trapezoid spanning top -->
  <polygon points="0,0 100,0 58,26 0,26"/>
  <!-- Right piece: vertical bar with angled top-left and bottom-left -->
  <polygon points="62,0 100,0 100,60 68,60 58,50 58,26"/>
  <!-- Left piece: vertical bar with angled bottom-right -->
  <polygon points="0,30 26,30 26,68 38,80 0,80"/>
  <!-- Bottom piece: wide bar with angled top-left -->
  <polygon points="38,80 26,68 26,100 100,100 100,68 68,68"/>
</svg>
